<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bali Mask Distribution Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ================================================================== */
        /* CSS SECTION 1: BASIC SETTINGS & MAIN MAP                            */
        /* ================================================================== */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* Map Title UI - Floating position at top left */
        .map-title-container { position: absolute; top: 20px; left: 20px; z-index: 1100; background: rgba(255, 255, 255, 0.95); padding: 12px 18px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); pointer-events: none; border-left: 5px solid #e74c3c; }
        .map-main-title { margin: 0; font-size: 18px; color: #2c3e50; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .map-sub-title { margin: 4px 0 0 0; font-size: 13px; color: #7f8c8d; }

        /* ================================================================== */
        /* CSS SECTION 2: SEARCH INTERFACE (SEARCH BAR)                        */
        /* ================================================================== */
        .search-container { position: absolute; top: 20px; right: 20px; z-index: 1100; background: white; padding: 6px 14px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 350px; max-width: 100%; display: flex; align-items: center; border: 1px solid #f1f5f9; transition: all 0.3s ease; }
        .search-container:focus-within { box-shadow: 0 6px 25px rgba(231, 76, 60, 0.2); border-color: #fbd3ce; }
        .search-icon { color: #e74c3c; margin-right: 10px; display: flex; align-items: center; justify-content: center; }
        .search-icon svg { width: 20px; height: 20px; } 
        .search-input { width: 100%; border: none; padding: 8px 4px; font-size: 15px; outline: none; background: transparent; color: #334155; font-family: inherit; }
        .search-input::placeholder { color: #94a3b8; font-style: italic; }
        .clear-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px; border-radius: 50%; display: none; align-items: center; justify-content: center; transition: background-color 0.2s, color 0.2s; }
        .clear-btn:hover { background-color: #f1f5f9; color: #e74c3c; }
        .clear-btn svg { width: 16px; height: 16px; }
        
        .search-counter { position: absolute; top: 75px; right: 20px; z-index: 1100; background: #e74c3c; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 10px rgba(231, 76, 60, 0.3); display: none; white-space: nowrap; }
        .no-result-toast { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #334155; color: white; padding: 10px 20px; border-radius: 8px; z-index: 1100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: none; opacity: 0; transition: opacity 0.3s; }
        .highlight { background-color: #fef08a; padding: 0 2px; border-radius: 2px; font-weight: 600; color: #b45309; }

        /* ================================================================== */
        /* CSS SECTION 3: DESKTOP POPUP & MOBILE DRAWER (INFORMATION VIEW)    */
        /* ================================================================== */
        /* Desktop Popup */
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .leaflet-popup-content { margin: 0; width: 320px !important; }
        .popup-header { background: #e74c3c; color: white; padding: 15px; font-size: 16px; font-weight: bold; border-bottom: 3px solid #c0392b; }
        .popup-body { padding: 15px; max-height: 280px; overflow-y: auto; background: white; }
        
        /* Mobile Drawer */
        #mobile-drawer { position: fixed; bottom: -100%; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); z-index: 2000; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 40vh; display: flex; flex-direction: column; }
        #mobile-drawer.active { bottom: 0; }
        .drawer-handle-container { width: 100%; padding: 10px 0 5px; display: flex; justify-content: center; cursor: pointer; }
        .drawer-handle { width: 40px; height: 5px; background: #cbd5e1; border-radius: 3px; }
        .drawer-header { padding: 10px 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; }
        .drawer-title { font-size: 18px; font-weight: bold; color: #1e293b; margin: 0; }
        .drawer-close { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #64748b; cursor: pointer; }
        .drawer-body { padding: 15px 20px 20px; overflow-y: auto; flex-grow: 1; }
        #map-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1500; display: none; opacity: 0; transition: opacity 0.3s; }
        #map-overlay.active { display: block; opacity: 1; }

        /* ================================================================== */
        /* CSS SECTION 4: MASK ACCORDION CARD & IMAGE (DETAIL UI)            */
        /* ================================================================== */
        .mask-item { margin-bottom: 12px; border: 1px dashed #cbd5e1; border-radius: 8px; overflow: hidden; }
        .mask-item:last-child { margin-bottom: 0; }
        .mask-summary { padding: 12px; background: #f8fafc; cursor: pointer; font-weight: bold; color: #0f172a; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .mask-summary:hover { background: #f1f5f9; }
        .mask-summary::marker, .mask-summary::-webkit-details-marker { display: none; }
        .mask-summary-icon { color: #e74c3c; transition: transform 0.3s; }
        details[open] .mask-summary-icon { transform: rotate(180deg); }
        details[open] .mask-summary { background: #fff5f5; border-bottom: 1px dashed #cbd5e1; color: #e74c3c; }
        .mask-details { padding: 15px; background: white; font-size: 14px; line-height: 1.6; color: #475569; }
        .mask-meta { display: inline-block; background: #f1f5f9; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #64748b; margin-bottom: 8px; margin-right: 5px; font-weight: 600; }
        .mask-desc-title { font-weight: bold; color: #334155; margin-top: 10px; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;}
        .mask-desc-content { text-align: justify; margin: 0; }
        
        .mask-image-container { width: 100%; border-radius: 6px; overflow: hidden; margin-bottom: 12px; background: #f1f5f9; position: relative; min-height: 150px; display: flex; align-items: center; justify-content: center; }
        .mask-image { width: 100%; height: auto; display: block; object-fit: contain; max-height: 250px; }
        .img-fallback { padding: 20px; text-align: center; color: #94a3b8; font-size: 12px; }
        .img-fallback svg { width: 40px; height: 40px; margin-bottom: 8px; color: #cbd5e1; }

        /* ================================================================== */
        /* CSS SECTION 5: RESPONSIVE DESIGN (MOBILE)                          */
        /* ================================================================== */
        @media (max-width: 768px) {
            .map-title-container { top: 15px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 480px; text-align: center; padding: 8px; border-left: none; border-top: 3px solid #e74c3c; }
            .map-main-title { font-size: 15px; }
            .map-sub-title { font-size: 11px; }
            .search-container { width: 90%; top: 85px; left: 50%; right: auto; transform: translateX(-50%); }
            .search-counter { top: 130px; left: 50%; right: auto; transform: translateX(-50%); } 
            .leaflet-popup { display: none !important; } /* Hide default popup on mobile */
            .leaflet-control-zoom { display: none; } /* Hide zoom buttons on mobile */
        }
    </style>
</head>
<body>

    <div class="map-title-container">
        <h1 class="map-main-title">Bali Mask Distribution Map</h1>
    </div>

    <div class="search-container" id="searchBox">
        <div class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>
        <input type="text" id="searchInput" class="search-input" placeholder="Search character, ID, year, or location..." autocomplete="off">
        <button id="clearBtn" class="clear-btn" title="Clear search">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    
    <div id="searchCounter" class="search-counter">Showing X locations</div>
    <div id="noResultToast" class="no-result-toast">No matching mask data found.</div>

    <div id="map-overlay"></div>
    <div id="map"></div>

    <div id="mobile-drawer">
        <div class="drawer-handle-container" id="drawerHandle">
            <div class="drawer-handle"></div>
        </div>
        <div class="drawer-header">
            <h3 class="drawer-title" id="drawerTitle">Location</h3>
            <button class="drawer-close" id="drawerClose">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="drawer-body" id="drawerBody">
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ========================================================================= //
        // JS SECTION 1: GLOBAL VARIABLES & LEAFLET MAP INITIALIZATION               //
        // ========================================================================= //
        let allMaskData = []; 
        let markersGroup = L.layerGroup(); 
        let currentSearchQuery = ""; 
        let isMobile = window.innerWidth <= 768; 

        // Basic Map Setting
        const map = L.map('map', { zoomControl: false }).setView([-8.409518, 115.188916], 10); 
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CartoDB</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        map.attributionControl.setPrefix('Developed by &copy; <strong>Luh Made Tirta Dewi</strong>');
        markersGroup.addTo(map);

        // Custom Leaflet Marker Icon
        const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Detect Screen Size Changes (Responsive Mobile/Desktop)
        window.addEventListener('resize', () => {
            const wasMobile = isMobile;
            isMobile = window.innerWidth <= 768;
            if (wasMobile !== isMobile) {
                const drawer = document.getElementById('mobile-drawer');
                if (!isMobile && drawer.classList.contains('active')) closeDrawer();
            }
        });


        // ========================================================================= //
        // JS SECTION 2: UTILITY FUNCTIONS (PROCESSING TOOLS)                        //
        // ========================================================================= //
        
        function highlightText(text, query) {
            if (!query || query.trim() === "") return text;
            const safeText = String(text).replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return safeText.replace(regex, '<span class="highlight">$1</span>');
        }

        // IMPROVED: Robust CSV Parser for various environments
        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                // Regex handles commas in quotes
                const row = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if (row && row.length >= 8) {
                    const clean = row.map(c => c.replace(/^"|"$/g, '').trim());
                    result.push({ 
                        no: clean[0], id: clean[1], name: clean[2], year: clean[3], 
                        location: clean[4], fullAddress: clean[5], desc: clean[6], 
                        lat: parseFloat(clean[7]), lng: parseFloat(clean[8]), photo: clean[9] || '' 
                    });
                }
            }
            return result;
        }

        function groupDataByLocation(data) {
            const grouped = {};
            data.forEach(item => {
                if (isNaN(item.lat)) return;
                const key = `${item.lat}_${item.lng}`;
                if (!grouped[key]) {
                    grouped[key] = { lat: item.lat, lng: item.lng, locationName: item.location, fullAddress: item.fullAddress, items: [] };
                }
                grouped[key].items.push(item);
            });
            return grouped;
        }

        // ========================================================================= //
        // JS SECTION 3: INTERFACE CONSTRUCTION LOGIC (HTML RENDERER)                //
        // ========================================================================= //
        
        function generateHTMLContent(locationData, query = "") {
            const itemCount = locationData.items.length;
            let html = `<div class="popup-header">
                            <div>${locationData.locationName}</div>
                            <div style="font-size: 12px; font-weight: normal; margin-top: 2px;">Full Address: ${locationData.fullAddress}</div>
                        </div>
                        <div class="popup-body">`;
            
            locationData.items.forEach(item => {
                html += `
                <details class="mask-item">
                    <summary class="mask-summary">
                        <span>${highlightText(item.name, query)}</span>
                        <svg class="mask-summary-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                        </svg>
                    </summary>
                    <div class="mask-details">
                        <div class="mask-image-container">
                            <img src="images/${item.photo}" class="mask-image" onerror="this.parentElement.innerHTML='<div class=\\'img-fallback\\'>Photo not available</div>'">
                        </div>
                        <div> <span class="mask-meta">ID: ${item.id}</span> <span class="mask-meta">Year: ${item.year}</span></div>
                        <div class="mask-desc-title">Historical Narrative:</div>
                        <p class="mask-desc-content">${highlightText(item.desc, query)}</p>
                    </div>
                </details>`;
            });
            return html + `</div>`;
        }

        function renderMap(data, query = "") {
            markersGroup.clearLayers();
            const groupedData = groupDataByLocation(data);
            for (const key in groupedData) {
                const loc = groupedData[key];
                const marker = L.marker([loc.lat, loc.lng], { icon: redIcon });
                marker.on('click', () => {
                    if (isMobile) openDrawer(loc, query);
                    else L.popup({maxWidth: 320}).setLatLng([loc.lat, loc.lng]).setContent(generateHTMLContent(loc, query)).openOn(map);
                    map.flyTo(isMobile ? [loc.lat-0.05, loc.lng] : [loc.lat+0.01, loc.lng], 13);
                });
                markersGroup.addLayer(marker);
            }
        }

        // ========================================================================= //
        // JS SECTION 4: INITIALIZATION                                              //
        // ========================================================================= //
        async function loadData() {
            try {
                const response = await fetch('Data Topeng.csv');
                if (!response.ok) throw new Error("CSV not found");
                const text = await response.text();
                allMaskData = parseCSV(text);
                console.log("Data loaded:", allMaskData);
                renderMap(allMaskData);
            } catch (err) { console.error("Error loading CSV:", err); }
        }

        window.onload = loadData;

        // Search logic remains the same...
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allMaskData.filter(i => i.name.toLowerCase().includes(q) || i.location.toLowerCase().includes(q));
            renderMap(filtered, q);
        });
    </script>
</body>
</html>
