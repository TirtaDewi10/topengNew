<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Sebaran Topeng Bali (Standard Popup)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* Map Title UI */
        .map-title-container { position: absolute; top: 20px; left: 20px; z-index: 1100; background: rgba(255, 255, 255, 0.95); padding: 12px 18px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); pointer-events: none; border-left: 5px solid #e74c3c; }
        .map-main-title { margin: 0; font-size: 18px; color: #2c3e50; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Search Container */
        .search-container { position: absolute; top: 20px; right: 20px; z-index: 1100; background: white; padding: 6px 14px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 350px; max-width: 100%; display: flex; align-items: center; border: 1px solid #f1f5f9; transition: all 0.3s ease; }
        .search-input { width: 100%; border: none; padding: 8px 4px; font-size: 15px; outline: none; background: transparent; color: #334155; }
        .clear-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px; border-radius: 50%; display: none; }
        .search-counter { position: absolute; top: 75px; right: 20px; z-index: 1100; background: #e74c3c; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 10px rgba(231, 76, 60, 0.3); display: none; }
        .no-result-toast { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #334155; color: white; padding: 10px 20px; border-radius: 8px; z-index: 1100; display: none; }
        .highlight { background-color: #fef08a; padding: 0 2px; border-radius: 2px; color: #b45309; }

        /* Popup Customization */
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .popup-header { background: #e74c3c; color: white; padding: 12px; font-size: 14px; font-weight: bold; }
        .popup-body { padding: 10px; max-height: 250px; overflow-y: auto; background: white; }
        
        /* Accordion Cards */
        .mask-item { margin-bottom: 8px; border: 1px dashed #cbd5e1; border-radius: 6px; overflow: hidden; }
        .mask-summary { padding: 10px; cursor: pointer; font-weight: bold; color: #0f172a; font-size: 13px; }
        .mask-details { padding: 10px; font-size: 12px; }
        .mask-image { width: 100%; height: auto; max-height: 150px; object-fit: contain; }
        .mask-meta { display: block; font-size: 11px; color: #64748b; margin-top: 5px; }

        @media (max-width: 768px) {
            .map-title-container { top: 15px; left: 50%; transform: translateX(-50%); width: 85%; text-align: center; }
            .search-container { width: 90%; top: 70px; left: 50%; right: auto; transform: translateX(-50%); }
            .search-counter { top: 115px; left: 50%; right: auto; transform: translateX(-50%); } 
        }
    </style>
</head>
<body>

    <div class="map-title-container">
        <h1 class="map-main-title">Peta Persebaran Topeng Bali</h1>
    </div>

    <div class="search-container" id="searchBox">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari data..." autocomplete="off">
        <button id="clearBtn" class="clear-btn">X</button>
    </div>
    
    <div id="searchCounter" class="search-counter"></div>
    <div id="noResultToast" class="no-result-toast">Data tidak ditemukan.</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let allMaskData = []; 
        let markersGroup = L.layerGroup(); 

        const map = L.map('map').setView([-8.409518, 115.188916], 10); 
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);
        
        markersGroup.addTo(map);

        const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
        });

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const row = lines[i].match(/(?:\"([^\"]*(?:\"\"[^\"]*)*)\")|([^\,]+)/g);
                if (row && row.length >= 8) {
                    const lat = parseFloat(row[6].replace(/^"|"$/g, '').trim());
                    const lng = parseFloat(row[7].replace(/^"|"$/g, '').trim());
                    result.push({ 
                        name: row[2].replace(/^"|"$/g, '').trim(), 
                        id: row[1].replace(/^"|"$/g, '').trim(), 
                        year: row[3].replace(/^"|"$/g, '').trim(), 
                        location: row[4].replace(/^"|"$/g, '').trim(), 
                        desc: row[5].replace(/^"|"$/g, '').trim(), 
                        lat, lng, 
                        photo: (row.length > 8) ? row[8].replace(/^"|"$/g, '').trim() : '' 
                    });
                }
            }
            return result;
        }

        function groupDataByLocation(data) {
            const grouped = {};
            data.forEach(item => {
                const key = `${item.lat}_${item.lng}`;
                if (!grouped[key]) grouped[key] = { lat: item.lat, lng: item.lng, locationName: item.location, items: [] };
                grouped[key].items.push(item);
            });
            return grouped;
        }

        function generateHTMLContent(locationData, query = "") {
            let html = `<div class="popup-header">${locationData.locationName}</div><div class="popup-body">`;
            locationData.items.forEach(item => {
                html += `
                <details class="mask-item">
                    <summary class="mask-summary">${highlightText(item.name, query)}</summary>
                    <div class="mask-details">
                        <span class="mask-meta">ID: ${item.id} | Tahun: ${item.year}</span>
                        <p>${highlightText(item.desc, query)}</p>
                    </div>
                </details>`;
            });
            html += `</div>`;
            return html;
        }

        function renderMap(data, query = "") {
            markersGroup.clearLayers();
            const groupedData = groupDataByLocation(data);
            let markerCount = 0;

            for (const key in groupedData) {
                const loc = groupedData[key];
                markerCount++;
                const marker = L.marker([loc.lat, loc.lng], { icon: redIcon });
                
                // POPUP STANDAR: Selalu digunakan baik di HP maupun Desktop
                marker.bindPopup(generateHTMLContent(loc, query), { maxWidth: 300 });
                markersGroup.addLayer(marker);
            }

            // Update UI Pencarian
            const counterEl = document.getElementById('searchCounter');
            if (query !== "") {
                counterEl.textContent = `Hasil: ${markerCount} lokasi`;
                counterEl.style.display = 'block';
            } else {
                counterEl.style.display = 'none';
            }
        }

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');

        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (query.length > 0) clearBtn.style.display = 'block';
            else clearBtn.style.display = 'none';
            
            const filteredData = allMaskData.filter(item => 
                item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query)
            );
            renderMap(filteredData, query);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = "";
            clearBtn.style.display = 'none';
            renderMap(allMaskData, "");
        });

        async function loadData() {
            try {
                const response = await fetch('Data Topeng.csv');
                if (response.ok) {
                    const csvText = await response.text();
                    allMaskData = parseCSV(csvText);
                    renderMap(allMaskData, ""); 
                }
            } catch (err) { console.error("Error loading CSV"); }
        }

        window.onload = loadData;

    </script>
</body>
</html>
