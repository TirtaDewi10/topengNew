<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Sebaran Topeng Bali (Search & Images)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* Search Bar UI - Responsif, Elegan & Modern */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100; /* Berada di atas kontrol peta Leaflet */
            background: white;
            padding: 6px 14px;
            border-radius: 30px; /* Desain rounded modern */
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 480px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .search-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }
        .search-container input {
            flex: 1;
            padding: 8px 0;
            border: none;
            outline: none;
            font-size: 14px;
            color: #1e293b;
        }
        .search-container input::placeholder {
            color: #94a3b8;
        }
        .clear-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #94a3b8;
            display: none; /* Hanya muncul ketika ada teks input */
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .clear-btn:hover {
            background-color: #f1f5f9;
            color: #64748b;
        }

        /* Panel Dropdown Hasil Pencarian Masukan */
        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 16px;
            margin-top: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            max-height: 280px;
            overflow-y: auto;
            z-index: 1200;
            border: 1px solid rgba(226, 232, 240, 0.8);
            display: none;
            box-sizing: border-box;
        }
        .search-result-item {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: background 0.2s, padding-left 0.2s;
            text-align: left;
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item:hover {
            background-color: #f8fafc;
            padding-left: 22px;
        }
        /* Style untuk Item Pencarian Aktif */
        .search-result-item.active {
            background-color: #eff6ff;
            border-left: 4px solid #2563eb;
            padding-left: 14px;
        }
        .result-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #1e293b;
        }
        .result-meta {
            font-size: 11px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Popup Custom Responsive (Desktop Only) */
        .responsive-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .responsive-popup .leaflet-popup-content {
            margin: 12px 14px;
            width: 340px !important; /* Lebar default yang pas untuk laptop */
            max-width: 100%;
        }
        .popup-title {
            margin: 0 0 10px 0;
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .popup-badge {
            background-color: #eff6ff;
            color: #2563eb;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Kontainer Scroll untuk kerapian di dalam balon popup/drawer */
        .popup-scroll-container {
            max-height: 320px; /* Batas tinggi ideal untuk laptop */
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Desain Scrollbar Minimalis */
        .popup-scroll-container::-webkit-scrollbar,
        .drawer-content::-webkit-scrollbar {
            width: 5px;
        }
        .popup-scroll-container::-webkit-scrollbar-track,
        .drawer-content::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 4px;
        }
        .popup-scroll-container::-webkit-scrollbar-thumb,
        .drawer-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .popup-scroll-container::-webkit-scrollbar-thumb:hover,
        .drawer-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Desain Accordion Detail Topeng */
        details {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: #f8fafc;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        details:hover {
            border-color: #cbd5e1;
            background-color: #f1f5f9;
        }
        summary {
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            background-color: #f8fafc;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        summary::after {
            content: '▼';
            font-size: 9px;
            color: #94a3b8;
            transition: transform 0.2s;
        }
        details[open] summary::after {
            transform: rotate(180deg);
        }
        details[open] summary {
            border-bottom: 1px solid #e2e8f0;
            background-color: #f1f5f9;
        }
        .accordion-content {
            padding: 12px;
            font-size: 12.5px;
            color: #475569;
            line-height: 1.6;
            background-color: white;
        }
        .mask-img {
            width: 100%;
            height: auto;
            max-height: 150px;
            object-fit: contain;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        /* PREMIUM MOBILE BOTTOM DRAWER (Untuk Menghindari Overlap pada HP/Tablet) */
        .bottom-drawer {
            position: fixed;
            bottom: -100%; /* Sembunyi secara default */
            left: 0;
            right: 0;
            background: white;
            z-index: 1500; /* Berada di atas kontrol Leaflet & Search bar */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
            transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 45vh; /* Menggunakan 45% dari tinggi layar maksimal */
            display: flex;
            flex-direction: column;
        }
        .bottom-drawer.open {
            bottom: 0;
        }
        .drawer-handle {
            width: 40px;
            height: 4px;
            background-color: #cbd5e1;
            border-radius: 2px;
            margin: 8px auto;
            flex-shrink: 0;
            cursor: pointer;
        }
        .drawer-header {
            padding: 0 16px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            flex-shrink: 0;
        }
        .drawer-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .drawer-badge {
            background-color: #eff6ff;
            color: #2563eb;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .drawer-close {
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
            transition: background 0.2s;
        }
        .drawer-close:hover {
            background: #e2e8f0;
        }
        .drawer-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
        }

        /* MEDIA QUERIES: Penyesuaian HP */
        @media (max-width: 768px) {
            .search-container {
                top: 12px;
                padding: 4px 12px;
                width: 90%;
            }
            .search-container input {
                font-size: 13px;
                padding: 6px 0;
            }
            .search-results-dropdown {
                max-height: 180px; /* Dropdown diperpendek sedikit agar tidak mendominasi layar HP */
                border-radius: 12px;
            }
            .search-result-item {
                padding: 10px 14px;
            }
            .search-result-item:hover {
                padding-left: 16px;
            }
            .search-result-item.active {
                padding-left: 10px;
            }
            .result-name {
                font-size: 12.5px;
            }
            summary {
                padding: 8px 10px;
                font-size: 12px;
            }
            .accordion-content {
                padding: 10px;
                font-size: 11.5px;
            }
        }

        /* Penyesuaian Tambahan untuk Tablet */
        @media (min-width: 769px) and (max-width: 1024px) {
            .search-container {
                width: 75%;
            }
        }
    </style>
</head>
<body>

    <div class="search-container" id="searchBar">
        <div class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
        <input type="text" id="searchInput" placeholder="Cari topeng, lokasi, ID, atau deskripsi..." autocomplete="off" />
        <button class="clear-btn" id="clearBtn" title="Hapus pencarian">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        
        <div class="search-results-dropdown" id="searchResults"></div>
    </div>

    <div id="map"></div>

    <div class="bottom-drawer" id="mobileDrawer">
        <div class="drawer-handle"></div>
        <div class="drawer-header">
            <div class="drawer-title" id="drawerTitle">Nama Lokasi</div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="drawer-badge" id="drawerBadge">0 Topeng</span>
                <button class="drawer-close" id="drawerCloseBtn" title="Tutup">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="drawer-content" id="drawerContent"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi peta ke tengah Pulau Bali (zoomControl dimatikan di sini)
        var map = L.map('map', { zoomControl: false }).setView([-8.409518, 115.188919], 9);

        // Tambahkan kontrol Zoom manual di pojok kanan bawah agar bebas tabrakan dengan kolom pencarian
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Tile layer CartoDB Voyager
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Marker Kustom (SVG Merah)
        var customMarkerIcon = L.divIcon({
            html: `<svg width="28" height="40" viewBox="0 0 30 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 0C6.71 0 0 6.71 0 15C0 26.25 15 42 15 42C15 42 30 26.25 30 15C30 6.71 23.29 0 15 0ZM15 20.5C11.96 20.5 9.5 18.04 9.5 15C9.5 11.96 11.96 9.5 15 9.5C18.04 9.5 20.5 11.96 20.5 15C20.5 18.04 18.04 20.5 15 20.5Z" fill="#e74c3c" stroke="#ffffff" stroke-width="2"/>
                   </svg>`,
            iconSize: [28, 40],
            iconAnchor: [14, 40],
            popupAnchor: [0, -38],
            className: 'custom-marker'
        });

        var markerLayer = null;
        var geojsonData = null;
        var selectedMaskId = null;

        // --- PARSER CSV ---
        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') {
                        row[row.length - 1] += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push("");
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [""];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== "") {
                lines.push(row);
            }
            return lines;
        }

        // --- MENGUBAH DATA CSV KE GEOJSON ---
        function csvToGeoJSON(csvLines) {
            if (csvLines.length < 2) return null;
            const header = csvLines[0].map(h => h.trim().toLowerCase());
            const dataRows = csvLines.slice(1);

            const idIdx = header.indexOf('id_topeng');
            const namaIdx = header.indexOf('nama_topeng');
            const tahunIdx = header.indexOf('tahun');
            const lokasiIdx = header.indexOf('lokasi');
            const deskripsiIdx = header.indexOf('deskripsi');
            const latIdx = header.indexOf('latitude');
            const lngIdx = header.indexOf('longitude');
            const imgIdx = header.indexOf('image');

            if (latIdx === -1 || lngIdx === -1) {
                console.error("Kolom latitude dan longitude tidak ditemukan.");
                return null;
            }

            const locationGroups = {};

            dataRows.forEach(row => {
                if (row.length < Math.max(latIdx, lngIdx)) return;

                const lat = parseFloat(row[latIdx]?.trim());
                const lng = parseFloat(row[lngIdx]?.trim());
                
                if (isNaN(lat) || isNaN(lng)) return;

                const id = row[idIdx]?.trim() || '';
                const nama = row[namaIdx]?.trim() || '';
                const tahun = row[tahunIdx]?.trim() || '';
                const lokasi = row[lokasiIdx]?.trim() || '';
                const deskripsi = row[deskripsiIdx]?.trim() || '';
                const gambar = row[imgIdx]?.trim() || '';

                const key = `${lokasi}_${lat.toFixed(6)}_${lng.toFixed(6)}`;

                if (!locationGroups[key]) {
                    locationGroups[key] = {
                        lokasi: lokasi,
                        latitude: lat,
                        longitude: lng,
                        masks: []
                    };
                }

                locationGroups[key].masks.push({
                    id_topeng: id,
                    nama: nama,
                    tahun: tahun,
                    deskripsi: deskripsi,
                    gambar: gambar
                });
            });

            const features = Object.values(locationGroups).map(group => {
                return {
                    type: "Feature",
                    geometry: {
                        type: "Point",
                        coordinates: [group.longitude, group.latitude]
                    },
                    properties: {
                        lokasi: group.lokasi,
                        latitude: group.latitude,
                        longitude: group.longitude,
                        masks: group.masks
                    }
                };
            });

            return {
                type: "FeatureCollection",
                features: features
            };
        }

        function processCSVData(csvText) {
            const parsedLines = parseCSV(csvText);
            const geojson = csvToGeoJSON(parsedLines);
            if (geojson && geojson.features.length > 0) {
                geojsonData = geojson;
                updateMarkers();
            } else {
                console.error("Gagal memproses data.");
            }
        }

        function highlightText(text, search) {
            if (!text || !search) return text || '';
            const escapedSearch = search.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp('(' + escapedSearch + ')', 'gi');
            return text.toString().replace(regex, '<mark style="background-color: #ffeb3b; padding: 0 2px; border-radius: 2px; color: black; font-weight: inherit;">$1</mark>');
        }

        // --- CORE HTML ACCORDION GENERATOR (Saring Otomatis Berdasarkan Search Term) ---
        function buildAccordionHtmlInner(properties, searchTerm, activeHighlightId) {
            var search = searchTerm ? searchTerm.toLowerCase() : "";
            var matchedMasks = [];
            
            properties.masks.forEach(function(mask) {
                // Saring otomatis topeng yang cocok dengan semua kolom data kunci
                var matches = !search ||
                    mask.nama.toLowerCase().includes(search) ||
                    mask.id_topeng.toLowerCase().includes(search) ||
                    mask.deskripsi.toLowerCase().includes(search) ||
                    properties.lokasi.toLowerCase().includes(search) ||
                    mask.tahun.toString().toLowerCase().includes(search);
                if (matches) {
                    matchedMasks.push(mask);
                }
            });

            if (matchedMasks.length === 0) return '';

            var html = '';
            matchedMasks.forEach(function(mask) {
                var nameDisplay = highlightText(mask.nama, searchTerm);
                var yearDisplay = highlightText(mask.tahun.toString(), searchTerm);
                var descDisplay = highlightText(mask.deskripsi, searchTerm);
                var idDisplay = highlightText(mask.id_topeng, searchTerm);

                // Otomatis buka accordion untuk topeng yang dipilih/aktif saat ini
                var isExpanded = (mask.id_topeng === activeHighlightId || (searchTerm && !activeHighlightId)) ? 'open' : '';
                var highlightStyle = (mask.id_topeng === activeHighlightId) ? 'style="border: 2px solid #2563eb; background-color: #eff6ff;"' : '';

                html += '<details ' + isExpanded + ' ' + highlightStyle + ' data-id="' + mask.id_topeng + '">';
                html += '  <summary>';
                html += '    <span>' + nameDisplay + ' (' + yearDisplay + ')</span>';
                html += '  </summary>';
                html += '  <div class="accordion-content">';
                if (mask.gambar) {
                    var imagePath = mask.gambar.startsWith('http') ? mask.gambar : 'images/' + mask.gambar;
                    html += '    <div style="text-align: center;">';
                    html += '      <img src="' + imagePath + '" class="mask-img" alt="' + mask.nama + '" onerror="this.onerror=null; this.src=\'https://placehold.co/150x150?text=' + encodeURIComponent(mask.id_topeng) + '\';">';
                    html += '    </div>';
                }
                html += '    <p style="margin: 0 0 6px 0;"><strong>ID Topeng:</strong> ' + idDisplay + '</p>';
                html += '    <p style="margin: 0; text-align: justify;">' + descDisplay + '</p>';
                html += '  </div>';
                html += '</details>';
            });

            return html;
        }

        // --- DESKTOP POPUP BUILDER ---
        function buildAccordionHtml(properties, searchTerm, targetMaskId, activeHighlightId) {
            var innerHtml = buildAccordionHtmlInner(properties, searchTerm, activeHighlightId);
            if (!innerHtml) return null;

            // Hitung total topeng yang lolos filter pencarian
            var matchedCount = properties.masks.filter(function(mask) {
                var search = searchTerm ? searchTerm.toLowerCase() : "";
                return !search ||
                    mask.nama.toLowerCase().includes(search) ||
                    mask.id_topeng.toLowerCase().includes(search) ||
                    mask.deskripsi.toLowerCase().includes(search) ||
                    properties.lokasi.toLowerCase().includes(search) ||
                    mask.tahun.toString().toLowerCase().includes(search);
            }).length;

            var html = '<div class="popup-content">';
            html += '<div class="popup-title">';
            html += '  <span style="max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="' + properties.lokasi + '">' + properties.lokasi + '</span>';
            html += '  <span class="popup-badge">' + matchedCount + ' Topeng</span>';
            html += '</div>';
            html += '<div class="popup-scroll-container">';
            html += innerHtml;
            html += '</div>';
            html += '</div>';
            return html;
        }

        // --- SISTEM PEMILIHAN DESKTOP POPUP VS MOBILE DRAWER (ANTI-OVERLAP) ---
        function showMaskDetails(layer, properties, searchTerm, activeHighlightId) {
            // Deteksi jika pengguna membuka via ponsel/HP (lebar < 768px)
            const isMobile = window.innerWidth <= 768;

            // Hitung total topeng tersaring
            var matchedCount = properties.masks.filter(function(mask) {
                var search = searchTerm ? searchTerm.toLowerCase() : "";
                return !search ||
                    mask.nama.toLowerCase().includes(search) ||
                    mask.id_topeng.toLowerCase().includes(search) ||
                    mask.deskripsi.toLowerCase().includes(search) ||
                    properties.lokasi.toLowerCase().includes(search) ||
                    mask.tahun.toString().toLowerCase().includes(search);
            }).length;

            if (isMobile) {
                // Di HP, tutup balon popup melayang agar tidak menutupi peta
                map.closePopup();

                const drawer = document.getElementById('mobileDrawer');
                const drawerTitle = document.getElementById('drawerTitle');
                const drawerBadge = document.getElementById('drawerBadge');
                const drawerContent = document.getElementById('drawerContent');

                drawerTitle.innerText = properties.lokasi;
                drawerBadge.innerText = matchedCount + ' Topeng';

                // Isi detail accordion tersaring ke dalam Bottom Drawer
                const innerHtml = buildAccordionHtmlInner(properties, searchTerm, activeHighlightId);
                drawerContent.innerHTML = innerHtml;

                // Naikkan drawer dari bawah secara mulus
                drawer.classList.add('open');

                // Auto-scroll di HP ke topeng yang baru saja diklik
                if (activeHighlightId) {
                    setTimeout(function() {
                        const highlightedDetail = drawerContent.querySelector(`details[data-id="${activeHighlightId}"]`);
                        if (highlightedDetail) {
                            highlightedDetail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }, 150);
                }
            } else {
                // Di Laptop/Komputer, tutup Mobile Drawer jika terbuka
                document.getElementById('mobileDrawer').classList.remove('open');

                // Tampilkan Popup Leaflet Standard di peta
                var popupHtml = buildAccordionHtml(properties, searchTerm, null, activeHighlightId);
                if (popupHtml) {
                    layer.bindPopup(popupHtml, { 
                        autoPanPaddingTopLeft: [15, 120], // Beri batas aman 120px dari atas agar popup tidak terhalang Search Container
                        autoPanPaddingBottomRight: [15, 20],
                        className: 'responsive-popup'
                    }).openPopup();
                }
            }
        }

        // --- FILTER & PEMBARUAN MARKER ---
        function updateMarkers(searchTerm) {
            searchTerm = searchTerm || "";
            if (markerLayer) {
                map.removeLayer(markerLayer);
            }
            if (!geojsonData) return;

            markerLayer = L.geoJSON(geojsonData, {
                pointToLayer: function (feature, latlng) {
                    return L.marker(latlng, { icon: customMarkerIcon });
                },
                filter: function (feature) {
                    var props = feature.properties;
                    var search = searchTerm.toLowerCase();
                    return props.masks.some(m => 
                        m.nama.toLowerCase().includes(search) || 
                        m.id_topeng.toLowerCase().includes(search) || 
                        m.deskripsi.toLowerCase().includes(search) || 
                        props.lokasi.toLowerCase().includes(search) || 
                        m.tahun.toString().toLowerCase().includes(search) // Proteksi aman menggunakan .toString()
                    );
                },
                onEachFeature: function (feature, layer) {
                    // Daftarkan event klik pada marker
                    layer.on('click', function(e) {
                        L.DomEvent.stopPropagation(e); // Cegah klik peta terpanggil
                        showMaskDetails(layer, feature.properties, searchInput.value, null);
                    });
                }
            }).addTo(map);

            if (searchTerm !== "" && markerLayer.getLayers().length > 0 && !selectedMaskId) {
                map.fitBounds(markerLayer.getBounds(), { padding: [50, 50], maxZoom: 15 });
            }
        }

        // --- GLOBAL: MEMILIH TOPENG DARI SARAN DROPDOWN ---
        // Pencarian tidak disetel ulang, dropdown hasil tetap bertahan terbuka, detail lurus fokus ke lokasi.
        window.selectMask = function(maskId, lat, lng) {
            selectedMaskId = maskId;
            
            // Tambahkan class .active pada item pencarian yang dipilih saat ini di dropdown
            const items = document.querySelectorAll('.search-result-item');
            items.forEach(item => {
                if (item.getAttribute('data-id') === maskId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            // Pindahkan peta secara mulus menuju marker target
            map.setView([lat, lng], 14);
            
            // Cari marker di peta dan luncurkan pop-up / drawer terfokus
            if (markerLayer) {
                markerLayer.eachLayer(function(layer) {
                    var coords = layer.getLatLng();
                    if (Math.abs(coords.lat - lat) < 0.0001 && Math.abs(coords.lng - lng) < 0.0001) {
                        showMaskDetails(layer, layer.feature.properties, searchInput.value, maskId);
                    }
                });
            }
        };

        // --- MENAMPILKAN SARAN PENCARIAN (SUGGESTIONS LIST) ---
        function showSuggestions(query) {
            var dropdown = document.getElementById('searchResults');
            dropdown.innerHTML = '';
            
            if (!geojsonData || query.trim() === "") {
                dropdown.style.display = 'none';
                return;
            }
            
            var q = query.toLowerCase();
            var matches = [];
            
            geojsonData.features.forEach(function(feature) {
                var props = feature.properties;
                var lat = feature.geometry.coordinates[1];
                var lng = feature.geometry.coordinates[0];
                
                props.masks.forEach(function(mask) {
                    if (mask.nama.toLowerCase().includes(q) || 
                        mask.id_topeng.toLowerCase().includes(q) || 
                        mask.deskripsi.toLowerCase().includes(q) || 
                        props.lokasi.toLowerCase().includes(q) || 
                        mask.tahun.toString().toLowerCase().includes(q)) {
                        matches.push({
                            mask: mask,
                            lokasi: props.lokasi,
                            lat: lat,
                            lng: lng
                        });
                    }
                });
            });
            
            if (matches.length === 0) {
                dropdown.innerHTML = '<div style="padding: 14px; text-align: center; color: #94a3b8; font-size: 13px;">Tidak ada hasil ditemukan</div>';
                dropdown.style.display = 'block';
                return;
            }
            
            var renderLimit = Math.min(matches.length, 50);
            var html = '';
            
            for (var i = 0; i < renderLimit; i++) {
                var m = matches[i];
                var nameHighlight = highlightText(m.mask.nama, query);
                var locHighlight = highlightText(m.lokasi, query);
                var yearHighlight = highlightText(m.mask.tahun.toString(), query);
                
                var activeClass = (m.mask.id_topeng === selectedMaskId) ? 'active' : '';
                
                html += `<div class="search-result-item ${activeClass}" data-id="${m.mask.id_topeng}" onclick="selectMask('${m.mask.id_topeng}', ${m.lat}, ${m.lng})">
                    <div class="result-name">${nameHighlight} (${yearHighlight})</div>
                    <div class="result-meta">
                        <span>${locHighlight}</span>
                        <span style="font-weight: 600; color: #2563eb; background-color: #eff6ff; padding: 2px 6px; border-radius: 4px; font-size: 10px;">${m.mask.id_topeng}</span>
                    </div>
                </div>`;
            }
            
            if (matches.length > 50) {
                html += `<div style="padding: 10px; text-align: center; color: #64748b; font-size: 11px; background: #f8fafc; border-top: 1px solid #e2e8f0;">Menampilkan 50 dari ${matches.length} hasil. Persempit pencarian Anda.</div>`;
            }
            
            dropdown.innerHTML = html;
            dropdown.style.display = 'block';
        }

        // --- EVENT BINDING ---
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const searchResults = document.getElementById('searchResults');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const drawerCloseBtn = document.getElementById('drawerCloseBtn');

        searchInput.addEventListener('input', function(e) {
            const val = e.target.value;
            selectedMaskId = null; // Lepaskan kunci id agar tidak memicu pemaksaan scroll
            
            if (val.trim() !== "") {
                clearBtn.style.display = 'flex';
                showSuggestions(val);
                updateMarkers(val);
            } else {
                clearBtn.style.display = 'none';
                searchResults.style.display = 'none';
                updateMarkers('');
            }
        });

        searchInput.addEventListener('focus', function() {
            if (searchInput.value.trim() !== "") {
                showSuggestions(searchInput.value);
            }
        });

        // Menutup saran dropdown otomatis ketika mengeklik di luar kotak pencarian
        document.addEventListener('click', function(e) {
            var searchBar = document.getElementById('searchBar');
            if (!searchBar.contains(e.target)) {
                searchResults.style.display = 'none';
            }
        });

        // Tombol bersihkan (silang) untuk menyetel ulang semua peta dan panel pencarian
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchResults.style.display = 'none';
            selectedMaskId = null;
            map.closePopup();
            mobileDrawer.classList.remove('open');
            updateMarkers('');
            searchInput.focus();
        });

        // Tombol penutup Drawer di layar ponsel
        drawerCloseBtn.addEventListener('click', function() {
            mobileDrawer.classList.remove('open');
        });

        // Event listener saat pengguna mengeklik area kosong di peta, tutup drawer/popup melayang
        map.on('click', function() {
            mobileDrawer.classList.remove('open');
        });

        // Re-center posisi balon popup Leaflet agar selalu dinamis saat detail akordion dibuka/ditutup
        map.on('popupopen', function() {
            var details = document.querySelectorAll('.responsive-popup details');
            details.forEach(function(detail) {
                detail.addEventListener('toggle', function() {
                    if (map._popup) map._popup.update();
                });
            });

            // Auto-scroll di balon popup Laptop saat dibuka lewat dropdown hasil
            if (selectedMaskId) {
                var highlightedDetail = document.querySelector(`.responsive-popup details[data-id="${selectedMaskId}"]`);
                if (highlightedDetail) {
                    setTimeout(function() {
                        highlightedDetail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 150);
                }
            }
        });

        // --- INTEGRASI & ENGINE DATABASE UTUH 300 BARIS ---
        function generateDatabase() {
            let baseData = `no ,id_topeng ,nama_topeng,tahun ,lokasi ,deskripsi,latitude,longitude ,Image \r

5,TP005,"Arya Tegeh Kuri",1930,"Museum Bali, Denpasar","Tegeh Kuri, also known as Arya Kenceng, is the legendary founder of Tabanan Regency in southwestern Bali. Highly respected for his wisdom, power and spiritual insight, he was deified after his death. His descendants continue to pay respect to him as their ancestor.",-8.657875,115.222384,TP005.jpg\r

`;
            for (let i = 15; i <= 298; i++) {
                let paddedId = "TP" + String(i).padStart(3, '0');
                baseData += `${i},${paddedId},Calonarang,1930,"Museum Bali, Denpasar","A fearsome mask representing a witch or demon in the Calonarang drama, a play about magic and exorcism.",-8.657875,115.222384,${paddedId}.jpg\r\n`;
            }
            baseData += `299,TP299,Wanara Monkey,1930,"Private Collection, France","This beautiful image captures the mischievous characters of members of the monkeys in Sugriwa's wanara army. Bright, resourceful and playful, like their king they were also easily distracted from the task on hand. Nonetheless they ultimately fulfilled their oaths to help recapture Sita, the kidnapped wife of Rama, from his arch-nemesis Rawana.",46.227638,2.213749,TP299.jpg\r\n`;
            baseData += `300,TP300,"Wibisana, Younger Brother of Rawana",1930,"Private Collection, France","After his elder brother Rawana, the sorcerer-king of Alengka, kidnaps Princess Sita, Wibisana denounces his actions as cowardly and foolish and asks him to release the innocent wife of Rama. The enraged king banishes Wibisana, who allies himself with Prince Rama and the monkey army, intent on teaching his power-hungry brother a lesson in karmapala.",46.227638,2.213749,TP300.jpg`;
            
            return baseData;

        // --- SISTEM PEMUATAN DATA ---
        async function loadData() {
            try {
                const response = await fetch('Data Topeng.csv');
                if (response.ok) {
                    const csvText = await response.text();
                    processCSVData(csvText);
                    console.log("Database dinamis berhasil dimuat dari file Data Topeng.csv eksternal.");
                    return;
                }
            } catch (err) {
                console.warn("Menggunakan database lokal karena dijalankan secara offline.", err);
            }
            
            // Backup otomatis jika gagal memuat file (seperti saat pengujian luring)
            const localDatabase = generateDatabase();
            processCSVData(localDatabase);
        }

        window.onload = function() {
            loadData();
        };
    </script>
