<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Sebaran Topeng Bali (Search & Images)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* Search Bar UI */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 80%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }
        .search-container input:focus { border-color: #2980b9; }

        .csv-badge {
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border: 1px solid #cbd5e0;
        }
        .csv-badge:hover {
            background-color: #cbd5e0;
        }

        /* Popup Accordion Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 5px;
        }
        .leaflet-popup-content {
            margin: 12px 14px;
            width: 360px !important; /* Lebar popup konsisten */
            max-width: 100%;
        }
        .popup-title {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        /* Kontainer Scroll untuk mencegah popup memanjang berantakan */
        .popup-scroll-container {
            max-height: 380px; /* Tinggi maksimal daftar topeng dalam popup */
            overflow-y: auto;  /* Aktifkan scrolling vertikal */
            padding-right: 6px;
            margin-top: 5px;
        }

        /* Desain Scrollbar Kustom */
        .popup-scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .popup-scroll-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .popup-scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .popup-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        details {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 8px;
            background-color: #f8fafc;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        details:hover {
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        summary {
            padding: 10px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            background-color: #f1f5f9;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        summary::after {
            content: '▼';
            font-size: 10px;
            color: #64748b;
            transition: transform 0.2s;
        }
        details[open] summary::after {
            transform: rotate(180deg);
        }
        details[open] summary {
            border-bottom: 1px solid #e2e8f0;
            background-color: #e2e8f0;
        }
        .accordion-content {
            padding: 12px;
            font-size: 13px;
            color: #334155;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
        }
        .mask-img {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 8px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        /* Drag and Drop Overlay */
        .upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            backdrop-filter: blur(5px);
        }
        .upload-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px dashed #3b82f6;
            transition: all 0.3s;
        }
        .upload-card.dragover {
            background: #0f172a;
            border-color: #10b981;
            transform: scale(1.02);
        }
        .upload-card h3 {
            margin-top: 0;
            color: #3b82f6;
        }
        .upload-card p {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .upload-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <!-- Kontrol Pencarian dan Update CSV -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Cari nama topeng, lokasi, atau tahun..." />
        <div class="csv-badge" title="Unggah atau Perbarui File CSV Secara Manual" onclick="document.getElementById('csvFileInput').click()">
            <span>📂 Perbarui CSV</span>
        </div>
        <input type="file" id="csvFileInput" accept=".csv" style="display: none;" />
    </div>

    <!-- Peta Utama -->
    <div id="map"></div>

    <!-- Dropzone Overlay jika ingin upload manual saat offline -->
    <div id="uploadPrompt" class="upload-overlay">
        <div class="upload-card" id="dropZone">
            <div style="font-size: 48px; margin-bottom: 10px;">📂</div>
            <h3>Perbarui Data Peta</h3>
            <p>Silakan seret & lepas (drag & drop) file <strong>Data Topeng.csv</strong> ke sini, atau klik tombol di bawah untuk memilih file manual.</p>
            <button class="upload-btn" onclick="document.getElementById('csvFileInput').click()">Pilih File CSV</button>
            <button class="upload-btn" style="background-color: #4b5563; margin-top: 5px;" onclick="document.getElementById('uploadPrompt').style.display='none'">Batal</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi peta Leaflet ke tengah Pulau Bali
        var map = L.map('map').setView([-8.409518, 115.188919], 9);

        // Menggunakan Tile layer CartoDB Voyager yang bersih dan modern
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Custom Marker SVG Merah Presisi Tinggi
        var customMarkerIcon = L.divIcon({
            html: `<svg width="28" height="40" viewBox="0 0 30 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 0C6.71 0 0 6.71 0 15C0 26.25 15 42 15 42C15 42 30 26.25 30 15C30 6.71 23.29 0 15 0ZM15 20.5C11.96 20.5 9.5 18.04 9.5 15C9.5 11.96 11.96 9.5 15 9.5C18.04 9.5 20.5 11.96 20.5 15C20.5 18.04 18.04 20.5 15 20.5Z" fill="#e74c3c" stroke="#ffffff" stroke-width="2"/>
                   </svg>`,
            iconSize: [28, 40],
            iconAnchor: [14, 40],
            popupAnchor: [0, -38],
            className: 'custom-marker'
        });

        var markerLayer = null;
        var geojsonData = null;

        // --- PARSER CSV ---
        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') {
                        row[row.length - 1] += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push("");
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [""];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== "") {
                lines.push(row);
            }
            return lines;
        }

        // --- MENGUBAH CSV KE GEOJSON (DENGAN CLUSTERING KOORDINAT SEJENIS) ---
        function csvToGeoJSON(csvLines) {
            if (csvLines.length < 2) return null;
            const header = csvLines[0].map(h => h.trim().toLowerCase());
            const dataRows = csvLines.slice(1);

            const idIdx = header.indexOf('id_topeng');
            const namaIdx = header.indexOf('nama_topeng');
            const tahunIdx = header.indexOf('tahun');
            const lokasiIdx = header.indexOf('lokasi');
            const deskripsiIdx = header.indexOf('deskripsi');
            const latIdx = header.indexOf('latitude');
            const lngIdx = header.indexOf('longitude');
            const imgIdx = header.indexOf('image');

            if (latIdx === -1 || lngIdx === -1) {
                console.error("Kolom koordinat tidak ditemukan.");
                return null;
            }

            const locationGroups = {};

            dataRows.forEach(row => {
                if (row.length < Math.max(latIdx, lngIdx)) return;

                const lat = parseFloat(row[latIdx]?.trim());
                const lng = parseFloat(row[lngIdx]?.trim());
                
                if (isNaN(lat) || isNaN(lng)) return;

                const id = row[idIdx]?.trim() || '';
                const nama = row[namaIdx]?.trim() || '';
                const tahun = row[tahunIdx]?.trim() || '';
                const lokasi = row[lokasiIdx]?.trim() || '';
                const deskripsi = row[deskripsiIdx]?.trim() || '';
                const gambar = row[imgIdx]?.trim() || '';

                const key = `${lokasi}_${lat.toFixed(6)}_${lng.toFixed(6)}`;

                if (!locationGroups[key]) {
                    locationGroups[key] = {
                        lokasi: lokasi,
                        latitude: lat,
                        longitude: lng,
                        masks: []
                    };
                }

                locationGroups[key].masks.push({
                    id_topeng: id,
                    nama: nama,
                    tahun: tahun,
                    deskripsi: deskripsi,
                    gambar: gambar
                });
            });

            const features = Object.values(locationGroups).map(group => {
                return {
                    type: "Feature",
                    geometry: {
                        type: "Point",
                        coordinates: [group.longitude, group.latitude]
                    },
                    properties: {
                        lokasi: group.lokasi,
                        masks: group.masks
                    }
                };
            });

            return {
                type: "FeatureCollection",
                features: features
            };
        }

        function processCSVData(csvText) {
            const parsedLines = parseCSV(csvText);
            const geojson = csvToGeoJSON(parsedLines);
            if (geojson && geojson.features.length > 0) {
                geojsonData = geojson;
                updateMarkers();
            } else {
                console.error("CSV tidak valid atau kosong.");
            }
        }

        function highlightText(text, search) {
            if (!text || !search) return text || '';
            const escapedSearch = search.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp('(' + escapedSearch + ')', 'gi');
            return text.toString().replace(regex, '<mark style="background-color: #ffeb3b; padding: 0 2px; border-radius: 2px; color: black;">$1</mark>');
        }

        // --- RENDER POPUP SCROLLING DAN ACCORDION LIST ---
        function buildAccordionHtml(properties, searchTerm) {
            var search = searchTerm.toLowerCase();
            var matchCount = 0;
            
            properties.masks.forEach(function(mask) {
                var matches = !search ||
                    mask.nama.toLowerCase().includes(search) ||
                    properties.lokasi.toLowerCase().includes(search) ||
                    mask.tahun.toString().toLowerCase().includes(search);
                if (matches) matchCount++;
            });

            if (matchCount === 0) return null;

            var html = '<div class="popup-content">';
            html += '<div class="popup-title">' + properties.lokasi + ' (' + matchCount + ' Topeng)</div>';
            html += '<div class="popup-scroll-container">';

            properties.masks.forEach(function(mask) {
                var matches = !search ||
                    mask.nama.toLowerCase().includes(search) ||
                    properties.lokasi.toLowerCase().includes(search) ||
                    mask.tahun.toString().toLowerCase().includes(search);

                if (matches) {
                    var nameDisplay = highlightText(mask.nama, search);
                    var yearDisplay = highlightText(mask.tahun.toString(), search);
                    var descDisplay = highlightText(mask.deskripsi, search);

                    html += '<details ' + (searchTerm ? 'open' : '') + '>';
                    html += '  <summary>';
                    html += '    <span>' + nameDisplay + ' (' + yearDisplay + ')</span>';
                    html += '  </summary>';
                    html += '  <div class="accordion-content">';
                    if (mask.gambar) {
                        // Terhubung ke folder images/ secara lokal maupun di web server GitHub Pages
                        var imagePath = mask.gambar.startsWith('http') ? mask.gambar : 'images/' + mask.gambar;
                        html += '    <div style="text-align: center;">';
                        html += '      <img src="' + imagePath + '" class="mask-img" alt="' + mask.nama + '" onerror="this.onerror=null; this.src=\'https://placehold.co/150x150?text=' + encodeURIComponent(mask.id_topeng) + '\';">';
                        html += '    </div>';
                    }
                    html += '    <p style="margin: 0 0 6px 0;"><strong>ID Topeng:</strong> ' + mask.id_topeng + '</p>';
                    html += '    <p style="margin: 0; text-align: justify;">' + descDisplay + '</p>';
                    html += '  </div>';
                    html += '</details>';
                }
            });

            html += '</div>';
            html += '</div>';
            return html;
        }

        function updateMarkers(searchTerm) {
            searchTerm = searchTerm || "";
            if (markerLayer) {
                map.removeLayer(markerLayer);
            }
            if (!geojsonData) return;

            markerLayer = L.geoJSON(geojsonData, {
                pointToLayer: function (feature, latlng) {
                    return L.marker(latlng, { icon: customMarkerIcon });
                },
                filter: function (feature) {
                    var props = feature.properties;
                    var search = searchTerm.toLowerCase();
                    return props.masks.some(m => 
                        m.nama.toLowerCase().includes(search) || 
                        props.lokasi.toLowerCase().includes(search) || 
                        m.tahun.toLowerCase().includes(search)
                    );
                },
                onEachFeature: function (feature, layer) {
                    var popupHtml = buildAccordionHtml(feature.properties, searchTerm);
                    if (popupHtml) {
                        layer.bindPopup(popupHtml, { autoPanPadding: [20, 20], minWidth: 360 });
                    }
                }
            }).addTo(map);

            if (searchTerm !== "" && markerLayer.getLayers().length > 0) {
                map.fitBounds(markerLayer.getBounds(), { padding: [50, 50] });
            }
        }

        // --- EVENT BINDING ---
        document.getElementById('searchInput').addEventListener('input', function(e) {
            updateMarkers(e.target.value);
        });

        map.on('popupopen', function() {
            var details = document.querySelectorAll('details');
            details.forEach(function(detail) {
                detail.addEventListener('toggle', function() {
                    if (map._popup) map._popup.update();
                });
            });
        });

        // --- LOGIKA DRAG & DROP DAN SELECT MANUAL ---
        const uploadPrompt = document.getElementById('uploadPrompt');
        const dropZone = document.getElementById('dropZone');
        const csvFileInput = document.getElementById('csvFileInput');

        window.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadPrompt.style.display = 'flex';
            dropZone.classList.add('dragover');
        });

        window.addEventListener('dragleave', function(e) {
            e.preventDefault();
            if (geojsonData) {
                uploadPrompt.style.display = 'none';
            }
            dropZone.classList.remove('dragover');
        });

        window.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        csvFileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.csv')) {
                alert('Pilih file berformat .csv');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                processCSVData(e.target.result);
                uploadPrompt.style.display = 'none';
            };
            reader.readAsText(file);
        }

        // --- SISTEM PEMUATAN DATA DUAL-MODE (UTAMA & CADANGAN) ---
        async function loadInitialData() {
            try {
                // Di GitHub Pages, kodingan ini otomatis membaca file 'Data Topeng.csv' di repositori Anda
                const response = await fetch('Data Topeng.csv');
                if (response.ok) {
                    const text = await response.text();
                    processCSVData(text);
                    console.log("Database peta berhasil dimuat secara otomatis dari Data Topeng.csv");
                    return;
                }
            } catch (err) {
                console.warn("Gagal memuat file CSV eksternal (mungkin karena dibuka offline). Menggunakan data cadangan bawaan.", err);
            }
            
            // Pemuatan cadangan jika gagal fetch (misal dijalankan lokal offline dengan double click)
            processCSVData(fallbackDatabaseCsv);
        }

        window.onload = function() {
            loadInitialData();
        };

        // DATA CADANGAN LENGKAP 300 DATA UTK PENCEGAHAN OFFLINE PREVIEW
        const fallbackDatabaseCsv = `no ,id_topeng ,nama_topeng,tahun ,lokasi ,deskripsi,latitude,longitude ,Image \r

299,TP299,Wanara Monkey,1930,"Private Collection, France","This beautiful image captures the mischievous characters of members of the monkeys in Sugriwa's wanara army. Bright, resourceful and playful, like their king they were also easily distracted from the task on hand. Nonetheless they ultimately fulfilled their oaths to help recapture Sita, the kidnapped wife of Rama, from his arch-nemesis Rawana.",46.227638,2.213749,TP299.jpg\r
300,TP300,"Wibisana, Younger Brother of Rawana",1930,"Private Collection, France","After his elder brother Rawana, the sorcerer-king of Alengka, kidnaps Princess Sita, Wibisana denounces his actions as cowardly and foolish and asks him to release the innocent wife of Rama. The enraged king banishes Wibisana, who allies himself with Prince Rama and the monkey army, intent on teaching his power-hungry brother a lesson in karmapala.",46.227638,2.213749,TP300.jpg`;
