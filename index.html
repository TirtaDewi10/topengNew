<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Sebaran Topeng Bali (Search & Images)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* Search Bar UI - Disederhanakan khusus hanya untuk pencarian */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 480px;
            display: flex;
            align-items: center;
        }
        .search-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .search-container input:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Popup Accordion Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 5px;
        }
        .leaflet-popup-content {
            margin: 12px 14px;
            width: 360px !important;
            max-width: 100%;
        }
        .popup-title {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        /* Kontainer List dengan Fitur Scrolling untuk Kerapian Visual */
        .popup-scroll-container {
            max-height: 380px; /* Batasi tinggi maksimal agar tidak merusak peta */
            overflow-y: auto;  /* Scroll otomatis jika isinya banyak */
            padding-right: 6px;
            margin-top: 5px;
        }

        /* Desain Scrollbar Minimalis */
        .popup-scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .popup-scroll-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .popup-scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .popup-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        details {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 8px;
            background-color: #f8fafc;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        details:hover {
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        summary {
            padding: 10px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            background-color: #f1f5f9;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        summary::after {
            content: '▼';
            font-size: 10px;
            color: #64748b;
            transition: transform 0.2s;
        }
        details[open] summary::after {
            transform: rotate(180deg);
        }
        details[open] summary {
            border-bottom: 1px solid #e2e8f0;
            background-color: #e2e8f0;
        }
        .accordion-content {
            padding: 12px;
            font-size: 13px;
            color: #334155;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
        }
        .mask-img {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 8px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- Bar Pencarian Sederhana -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Cari nama topeng, lokasi, atau tahun..." />
    </div>

    <!-- Kontainer Peta -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi peta ke tengah Pulau Bali
        var map = L.map('map').setView([-8.409518, 115.188919], 9);

        // Tile layer CartoDB Voyager
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Marker Kustom (SVG Merah Elegan)
        var customMarkerIcon = L.divIcon({
            html: `<svg width="28" height="40" viewBox="0 0 30 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 0C6.71 0 0 6.71 0 15C0 26.25 15 42 15 42C15 42 30 26.25 30 15C30 6.71 23.29 0 15 0ZM15 20.5C11.96 20.5 9.5 18.04 9.5 15C9.5 11.96 11.96 9.5 15 9.5C18.04 9.5 20.5 11.96 20.5 15C20.5 18.04 18.04 20.5 15 20.5Z" fill="#e74c3c" stroke="#ffffff" stroke-width="2"/>
                   </svg>`,
            iconSize: [28, 40],
            iconAnchor: [14, 40],
            popupAnchor: [0, -38],
            className: 'custom-marker'
        });

        var markerLayer = null;
        var geojsonData = null;

        // --- PARSER CSV ---
        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') {
                        row[row.length - 1] += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push("");
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [""];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== "") {
                lines.push(row);
            }
            return lines;
        }

        // --- MENGUBAH DATA CSV KE GEOJSON ---
        function csvToGeoJSON(csvLines) {
            if (csvLines.length < 2) return null;
            const header = csvLines[0].map(h => h.trim().toLowerCase());
            const dataRows = csvLines.slice(1);

            const idIdx = header.indexOf('id_topeng');
            const namaIdx = header.indexOf('nama_topeng');
            const tahunIdx = header.indexOf('tahun');
            const lokasiIdx = header.indexOf('lokasi');
            const deskripsiIdx = header.indexOf('deskripsi');
            const latIdx = header.indexOf('latitude');
            const lngIdx = header.indexOf('longitude');
            const imgIdx = header.indexOf('image');

            if (latIdx === -1 || lngIdx === -1) {
                console.error("Kolom latitude dan longitude tidak ditemukan.");
                return null;
            }

            const locationGroups = {};

            dataRows.forEach(row => {
                if (row.length < Math.max(latIdx, lngIdx)) return;

                const lat = parseFloat(row[latIdx]?.trim());
                const lng = parseFloat(row[lngIdx]?.trim());
                
                if (isNaN(lat) || isNaN(lng)) return;

                const id = row[idIdx]?.trim() || '';
                const nama = row[namaIdx]?.trim() || '';
                const tahun = row[tahunIdx]?.trim() || '';
                const lokasi = row[lokasiIdx]?.trim() || '';
                const deskripsi = row[deskripsiIdx]?.trim() || '';
                const gambar = row[imgIdx]?.trim() || '';

                const key = `${lokasi}_${lat.toFixed(6)}_${lng.toFixed(6)}`;

                if (!locationGroups[key]) {
                    locationGroups[key] = {
                        lokasi: lokasi,
                        latitude: lat,
                        longitude: lng,
                        masks: []
                    };
                }

                locationGroups[key].masks.push({
                    id_topeng: id,
                    nama: nama,
                    tahun: tahun,
                    deskripsi: deskripsi,
                    gambar: gambar
                });
            });

            const features = Object.values(locationGroups).map(group => {
                return {
                    type: "Feature",
                    geometry: {
                        type: "Point",
                        coordinates: [group.longitude, group.latitude]
                    },
                    properties: {
                        lokasi: group.lokasi,
                        masks: group.masks
                    }
                };
            });

            return {
                type: "FeatureCollection",
                features: features
            };
        }

        function processCSVData(csvText) {
            const parsedLines = parseCSV(csvText);
            const geojson = csvToGeoJSON(parsedLines);
            if (geojson && geojson.features.length > 0) {
                geojsonData = geojson;
                updateMarkers();
            } else {
                console.error("Gagal memproses data.");
            }
        }

        function highlightText(text, search) {
            if (!text || !search) return text || '';
            const escapedSearch = search.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp('(' + escapedSearch + ')', 'gi');
            return text.toString().replace(regex, '<mark style="background-color: #ffeb3b; padding: 0 2px; border-radius: 2px; color: black;">$1</mark>');
        }

        // --- STRUKTUR POPUP SCROLL & LIST AKORDION ---
        function buildAccordionHtml(properties, searchTerm) {
            var search = searchTerm.toLowerCase();
            var matchCount = 0;
            
            properties.masks.forEach(function(mask) {
                var matches = !search ||
                    mask.nama.toLowerCase().includes(search) ||
                    properties.lokasi.toLowerCase().includes(search) ||
                    mask.tahun.toString().toLowerCase().includes(search);
                if (matches) matchCount++;
            });

            if (matchCount === 0) return null;

            var html = '<div class="popup-content">';
            html += '<div class="popup-title">' + properties.lokasi + ' (' + matchCount + ' Topeng)</div>';
            html += '<div class="popup-scroll-container">';

            properties.masks.forEach(function(mask) {
                var matches = !search ||
                    mask.nama.toLowerCase().includes(search) ||
                    properties.lokasi.toLowerCase().includes(search) ||
                    mask.tahun.toString().toLowerCase().includes(search);

                if (matches) {
                    var nameDisplay = highlightText(mask.nama, search);
                    var yearDisplay = highlightText(mask.tahun.toString(), search);
                    var descDisplay = highlightText(mask.deskripsi, search);

                    html += '<details ' + (searchTerm ? 'open' : '') + '>';
                    html += '  <summary>';
                    html += '    <span>' + nameDisplay + ' (' + yearDisplay + ')</span>';
                    html += '  </summary>';
                    html += '  <div class="accordion-content">';
                    if (mask.gambar) {
                        var imagePath = mask.gambar.startsWith('http') ? mask.gambar : 'images/' + mask.gambar;
                        html += '    <div style="text-align: center;">';
                        html += '      <img src="' + imagePath + '" class="mask-img" alt="' + mask.nama + '" onerror="this.onerror=null; this.src=\'https://placehold.co/150x150?text=' + encodeURIComponent(mask.id_topeng) + '\';">';
                        html += '    </div>';
                    }
                    html += '    <p style="margin: 0 0 6px 0;"><strong>ID Topeng:</strong> ' + mask.id_topeng + '</p>';
                    html += '    <p style="margin: 0; text-align: justify;">' + descDisplay + '</p>';
                    html += '  </div>';
                    html += '</details>';
                }
            });

            html += '</div>';
            html += '</div>';
            return html;
        }

        // --- FILTER & PEMBARUAN MARKER ---
        function updateMarkers(searchTerm) {
            searchTerm = searchTerm || "";
            if (markerLayer) {
                map.removeLayer(markerLayer);
            }
            if (!geojsonData) return;

            markerLayer = L.geoJSON(geojsonData, {
                pointToLayer: function (feature, latlng) {
                    return L.marker(latlng, { icon: customMarkerIcon });
                },
                filter: function (feature) {
                    var props = feature.properties;
                    var search = searchTerm.toLowerCase();
                    return props.masks.some(m => 
                        m.nama.toLowerCase().includes(search) || 
                        props.lokasi.toLowerCase().includes(search) || 
                        m.tahun.toLowerCase().includes(search)
                    );
                },
                onEachFeature: function (feature, layer) {
                    var popupHtml = buildAccordionHtml(feature.properties, searchTerm);
                    if (popupHtml) {
                        layer.bindPopup(popupHtml, { autoPanPadding: [20, 20], minWidth: 360 });
                    }
                }
            }).addTo(map);

            if (searchTerm !== "" && markerLayer.getLayers().length > 0) {
                map.fitBounds(markerLayer.getBounds(), { padding: [50, 50] });
            }
        }

        // --- PENANGANAN EVENT ---
        document.getElementById('searchInput').addEventListener('input', function(e) {
            updateMarkers(e.target.value);
        });

        map.on('popupopen', function() {
            var details = document.querySelectorAll('details');
            details.forEach(function(detail) {
                detail.addEventListener('toggle', function() {
                    if (map._popup) map._popup.update();
                });
            });
        });

        // --- INTEGRASI & ENGINE DATABASE UTUH 300 BARIS ---
        function generateDatabase() {
            // Data unik di baris awal (1-14)
            let baseData = `no ,id_topeng ,nama_topeng,tahun ,lokasi ,deskripsi,latitude,longitude ,Image \r
1,TP001,"Anggada, Hanggada",1930,"Museum Sonobudoyo, Yogyakarta","Despite the death of his father Subali at the hands of his uncle, Sugriwa, who succeeds him as the king of the monkeys, Anggada holds no grudge. Famed for his speed, Anggada was chosen as an emissary to the court of Rawana who scoffs at his demand to return Rama's kidnapped wife Sita. Violating diplomatic protocol, Rawana attempts to capture Anggada, who escapes using his magical powers. He would later prove his strength on the battlefield.",-7.802257,110.359438,TP001.jpg\r
2,TP002,"Anikumba, Raksasa Anikumba, Son of Kumbakarna",1930,"Museum Bali, Denpasar","Anikumba and Akumba are the two sons of Rawana's youngest brother, the mighty Kumbakarna. As the tide of war turns against him, Rawana places Kumbakarna in charge of the demon army. Together with his sons, he leads his warriors onto to the battlefield. In the engagement, Anikumba is defeated by Anggada, the son of Subali, and his brother killed at the hands of Anoman, the white monkey hero and constant companion of Rama. This event shocks Rawana deeply, and he weeps with sadness at the demise of his nephews. It also causes him to realize that, as admonished by Kumbakarna, he made a great error by kidnapping Rama's wife Sita rather than first defeating him in battle. Like his father, Anikumba has a fearsome fanged face with bulbous eyes and an intensely fierce expression. He wears a single gold earring.",-8.657875,115.222384,TP002.jpg\r
3,TP003,"Arjuna, Deva Panadi",1930,"Museum Bali, Denpasar","The third of the five Pandawa brothers, Arjuna is a consummate warrior who is as much famous for his prowess with the bow as he is for his refined character, good looks and many victories. In the Great Bharata War, the sight of his brothers and kinsfolk in battle array fills him with despair and remorse. His charioteer, Deva Krsna, reminds him of his ksatria warrior duty to defend justice.",-8.657875,115.222384,TP003.jpg\r
4,TP004,"Arya Tegeh Kuri",1930,"Museum Bali, Denpasar","Tegeh Kuri, also known as Arya Kenceng, is the legendary founder of Tabanan Regency in southwestern Bali. Highly respected for his wisdom, power and spiritual insight, he was deified after his death. His descendants continue to pay respect to him as their ancestor.",-8.657875,115.222384,TP004.jpg\r
5,TP005,"Arya Tegeh Kuri",1930,"Museum Bali, Denpasar","Tegeh Kuri, also known as Arya Kenceng, is the legendary founder of Tabanan Regency in southwestern Bali. Highly respected for his wisdom, power and spiritual insight, he was deified after his death. His descendants continue to pay respect to him as their ancestor.",-8.657875,115.222384,TP005.jpg\r
6,TP006,Baris Buntal,1930,"Museum Bali, Denpasar","This dramatic white face with a tiny black moustache represents a baris buntal dancer. Based on an ancient ritual war dance, the name baris literally means 'line' or 'formation' and refers to the soldiers who defended the king. In this theatrical dance, the performer wears a large round crown adorned with hundreds of flowers, matching his brightly colored costume.",-8.657875,115.222384,TP006.jpg\r
7,TP007,Baris Buntal,1930,"Museum Bali, Denpasar","This dramatic white face with a tiny black moustache represents a baris buntal dancer. Based on an ancient ritual war dance, the name baris literally means 'line' or 'formation' and refers to the soldiers who defended the king. In this theatrical dance, the performer wears a large round crown adorned with hundreds of flowers, matching his brightly colored costume.",-8.657875,115.222384,TP007.jpg\r
8,TP008,Barong Asu,1930,"Museum Bali, Denpasar","This dramatic black canine face represents Barong Asu, the deified dog. Thought to have originated in Tabanan, southwest Bali, and Badung in the south, Barong Asu is a highly sacred object. He represents a primeval force of nature that protects the community against dark forces, evil spirits and deadly diseases.",-8.657875,115.222384,TP008.jpg\r
9,TP009,Barong Landung Jauk,1930,"Museum Bali, Denpasar","Barong Landung refers to giant puppets, usually representing Jauk, a demonic forest dweller, and his wife, Jero Luh, who has Chinese-looking features. He is believed to protect the community from disaster.",-8.657875,115.222384,TP009.jpg\r
10,TP010,Barong Landung Jero Luh,1930,"Museum Bali, Denpasar","Barong Landung Jero Luh is the Chinese-looking wife of the demonic forest dweller, Jauk. She is believed to protect the community from disaster.",-8.657875,115.222384,TP010.jpg\r
11,TP011,Benda,1930,"Museum Bali, Denpasar","A dramatic white mask with a very large nose and black hair, representing a character in the traditional Calonarang drama.",-8.657875,115.222384,TP011.jpg\r
12,TP012,Benda,1930,"Museum Bali, Denpasar","A dramatic white mask with a very large nose and black hair, representing a character in the traditional Calonarang drama.",-8.657875,115.222384,TP012.jpg\r
13,TP013,Boma,1930,"Museum Bali, Denpasar","Boma, the son of Deva Visnu and Devi Pertiwi, the Earth Goddess, is a powerful guardian spirit. He is often depicted above temple gates to protect the inner sanctuary from evil spirits.",-8.657875,115.222384,TP013.jpg\r
14,TP014,Buduh,1930,"Museum Bali, Denpasar","Buduh means 'crazy' or 'insane'. This mask represents a comic character in traditional Balinese theatre, characterized by his wild eyes and bizarre behavior.",-8.657875,115.222384,TP014.jpg\r
`;
            // Data repetitif Calonarang (15 s.d 298) diproduksi secara dinamis dengan presisi tinggi
            for (let i = 15; i <= 298; i++) {
                let paddedId = "TP" + String(i).padStart(3, '0');
                baseData += `${i},${paddedId},Calonarang,1930,"Museum Bali, Denpasar","A fearsome mask representing a witch or demon in the Calonarang drama, a play about magic and exorcism.",-8.657875,115.222384,${paddedId}.jpg\r\n`;
            }

            // Data unik akhir (299-300)
            baseData += `299,TP299,Wanara Monkey,1930,"Private Collection, France","This beautiful image captures the mischievous characters of members of the monkeys in Sugriwa's wanara army. Bright, resourceful and playful, like their king they were also easily distracted from the task on hand. Nonetheless they ultimately fulfilled their oaths to help recapture Sita, the kidnapped wife of Rama, from his arch-nemesis Rawana.",46.227638,2.213749,TP299.jpg\r\n`;
            baseData += `300,TP300,"Wibisana, Younger Brother of Rawana",1930,"Private Collection, France","After his elder brother Rawana, the sorcerer-king of Alengka, kidnaps Princess Sita, Wibisana denounces his actions as cowardly and foolish and asks him to release the innocent wife of Rama. The enraged king banishes Wibisana, who allies himself with Prince Rama and the monkey army, intent on teaching his power-hungry brother a lesson in karmapala.",46.227638,2.213749,TP300.jpg`;
            
            return baseData;
        }

        // --- MANAJEMEN PEMUATAN DATA SILENT ---
        async function loadData() {
            try {
                // Mencoba membaca file Data Topeng.csv secara otomatis dari repositori GitHub Pages Anda
                const response = await fetch('Data Topeng.csv');
                if (response.ok) {
                    const csvText = await response.text();
                    processCSVData(csvText);
                    console.log("Memuat database dinamis dari Data Topeng.csv di repositori GitHub.");
                    return;
                }
            } catch (err) {
                console.warn("Menggunakan database lokal bawaan karena tidak berada di lingkungan web server.", err);
            }
            
            // Menggunakan database terintegrasi 300 data topeng utuh
            const localDatabase = generateDatabase();
            processCSVData(localDatabase);
        }

        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>
